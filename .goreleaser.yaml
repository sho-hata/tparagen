# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - main: ./cmd/tparagen
    ldflags: -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  # Same notes as GitHub's "Generate release notes" button: a "What's Changed"
  # list of the merged pull requests plus the compare link. The release is
  # complete as soon as the tag is pushed; no manual release creation needed.
  use: github-native

# Publishes Casks/tparagen.rb to sho-hata/homebrew-tap, the tap fcrit lives
# in: `brew install sho-hata/tap/tparagen`.
homebrew_casks:
  - repository:
      owner: sho-hata
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sho-hata/tparagen
    description: Insert t.Parallel() into Go test functions and subtests
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Update tparagen to {{ .Tag }}"
    # Prerelease tags (v1.4.0-rc.1) are released on GitHub but not in the tap.
    skip_upload: auto
    # The binary is not notarized; without this macOS Gatekeeper blocks it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tparagen"]
          end
