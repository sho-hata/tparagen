name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Refuse to release a tag that does not point to a commit on main
      # (v1.1.3 was tagged on a pull request branch by mistake).
      - name: Ensure the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main. Delete the tag and re-tag a commit on main."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          # Build releases with the newest stable toolchain so shipped
          # binaries carry the latest standard library security fixes.
          go-version: stable
          check-latest: true
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
