name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # Build releases with the newest stable toolchain so shipped
          # binaries carry the latest standard library security fixes.
          go-version: stable
          check-latest: true
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
