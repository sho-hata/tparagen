name: 'bench'
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'
      - 'internal/regressioncheck/**'
permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ROUNDS: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Both sides run the head's benchmarks and corpus generator, so a
      # difference in the numbers is a difference in the code under test.
      - name: build base and head benchmark binaries
        id: build
        run: |
          go test -c -o "$RUNNER_TEMP/head.test" .

          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cp bench_test.go "$RUNNER_TEMP/base/bench_test.go"
          rm -rf "$RUNNER_TEMP/base/internal/benchcorpus"
          mkdir -p "$RUNNER_TEMP/base/internal"
          cp -r internal/benchcorpus "$RUNNER_TEMP/base/internal/benchcorpus"

          if ! (cd "$RUNNER_TEMP/base" && go test -c -o "$RUNNER_TEMP/base.test" .); then
            echo "::warning title=No benchmark baseline::The head benchmarks do not build against base $BASE_SHA (API changed). The regression check did not run."
            {
              echo "### Benchmarks"
              echo "No baseline: the head benchmarks do not build against base \`$BASE_SHA\` (API changed). Nothing to compare."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_base=true" >> "$GITHUB_OUTPUT"

      - name: install benchstat
        if: steps.build.outputs.has_base == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e

      # Alternating base and head cancels slow drift of the shared runner. Run
      # gets a fixed iteration count: each iteration is slow, and its setup is
      # untimed, so the default 1s benchtime would spend most of the job there.
      - name: run benchmarks
        if: steps.build.outputs.has_base == 'true'
        run: |
          for _ in $(seq "$ROUNDS"); do
            for side in base head; do
              out=old.txt
              [ "$side" = head ] && out=new.txt
              "$RUNNER_TEMP/$side.test" -test.run '^$' -test.bench '^BenchmarkGenerateTParallel' -test.benchmem -test.count 1 >> "$out"
              "$RUNNER_TEMP/$side.test" -test.run '^$' -test.bench '^BenchmarkRun$' -test.benchmem -test.benchtime 5x -test.count 1 >> "$out"
            done
          done

      - name: compare
        if: steps.build.outputs.has_base == 'true'
        run: |
          {
            echo "### Benchmarks: base \`${BASE_SHA::7}\` vs head"
            echo '```'
            benchstat old.txt new.txt | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          benchstat -format csv old.txt new.txt > result.csv
          go run ./internal/regressioncheck result.csv | tee -a "$GITHUB_STEP_SUMMARY"
