name: 'tparagen'
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@v5
      - name: set up
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./... -v

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  # Scans with the newest stable toolchain, i.e. what release binaries are
  # built with (see release.yml). The action checks out the repository and
  # sets up Go itself.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
